<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Создать мероприятие</title>
<style>
  body {
    font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    background: #f1f3f5;
    margin: 0;
    padding: 30px 20px;
    display: flex;
    justify-content: center;
  }
  .container {
    background: white;
    padding: 30px 40px;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    max-width: 420px;
    width: 100%;
  }
  h1 {
    font-weight: 700;
    font-size: 1.8em;
    margin-bottom: 28px;
    text-align: center;
    color: #212529;
  }
  label {
    display: block;
    font-weight: 600;
    margin-top: 18px;
    margin-bottom: 6px;
    color: #495057;
  }
  input[type="text"],
  input[type="datetime-local"],
  input[type="number"],
  input[type="email"] {
    width: 100%;
    padding: 12px 15px;
    border-radius: 8px;
    border: 2px solid #ced4da;
    font-size: 1em;
    transition: border-color 0.3s ease;
  }
  input[type="text"]:focus,
  input[type="datetime-local"]:focus,
  input[type="number"]:focus,
  input[type="email"]:focus {
    border-color: #3b82f6;
    outline: none;
  }
  button {
    margin-top: 30px;
    width: 100%;
    padding: 14px;
    background-color: #3b82f6;
    border: none;
    border-radius: 10px;
    color: white;
    font-weight: 700;
    font-size: 1.1em;
    cursor: pointer;
    transition: background-color 0.3s ease;
  }
  button:hover {
    background-color: #1e40af;
  }
  .links {
    margin-top: 25px;
    display: flex;
    justify-content: space-between;
    font-size: 0.9em;
  }
  .links a {
    color: #3b82f6;
    text-decoration: none;
    font-weight: 600;
  }
  .links a:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>Создать мероприятие</h1>
    <form method="POST" action="/api/events">
      <label for="name">Название</label>
      <input type="text" id="name" name="name" value="{{.Name}}" required />

      <label for="date">Дата и время</label>
      <input type="datetime-local" id="date" name="date" value="{{.Date}}" required />

      <label for="total_seats">Количество мест</label>
      <input type="number" id="total_seats" name="total_seats" min="1" value="{{.TotalSeats}}" required />

      <label for="booking_ttl_minutes">Время жизни брони (минуты)</label>
      <input type="number" id="booking_ttl_minutes" name="booking_ttl_minutes" min="1" value="{{.BookingTTLMinutes}}" required />

      <label for="email">Email организатора</label>
      <input type="email" id="email" name="email" value="{{.Email}}" required />

      <button type="submit">Создать</button>
    </form>

    <div class="links">
      <a href="/events">Все мероприятия</a>
      <a href="/profile">Профиль</a>
    </div>
  </div>
</body>
</html>
