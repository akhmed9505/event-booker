<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Профиль пользователя</title>
<style>
  body { font-family: Arial, sans-serif; margin: 20px; }
  label { display: block; margin-bottom: 10px; font-weight: bold; }
  input[type="email"], input[type="text"] { width: 300px; padding: 8px; margin-bottom: 10px; }
  .checkbox-group { margin-bottom: 20px; }
  button { padding: 8px 20px; background-color: #007BFF; color: white; border: none; border-radius: 4px; cursor: pointer; }
  button:hover { background-color: #0056b3; }
  .message { margin-bottom: 20px; color: green; }
  .error { margin-bottom: 20px; color: red; }
</style>
</head>
<body>
<h1>Профиль</h1>

{{if .Message}}
  <div class="message">{{.Message}}</div>
{{end}}
{{if .Error}}
  <div class="error">{{.Error}}</div>
{{end}}

<form method="POST" action="/profile">
  <label for="email">Email для уведомлений:</label>
  <input type="email" id="email" name="email" value="{{.Email}}" placeholder="Введите email">

  <div class="checkbox-group">
    <label><input type="checkbox" name="notify_email" value="1" {{if .NotifyEmail}}checked{{end}}> Получать уведомления по Email</label>
    <label><input type="checkbox" name="notify_telegram" value="1" {{if .NotifyTelegram}}checked{{end}}> Получать уведомления через Telegram</label>
  </div>

  <label for="telegram_id">Telegram Chat ID (если выбрали уведомления через Telegram):</label>
  <input type="text" id="telegram_id" name="telegram_id" value="{{.TelegramID}}" placeholder="Введите Telegram Chat ID">

  <button type="submit">Сохранить</button>
</form>
</body>
</html>
